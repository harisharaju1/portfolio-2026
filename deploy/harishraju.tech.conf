# /etc/nginx/sites-available/harishraju.tech
# Static portfolio. Files live in /var/www/harishraju.tech (synced by deploy.yml).

server {
    listen 80;
    listen [::]:80;
    server_name harishraju.tech www.harishraju.tech;
    return 301 https://harishraju.tech$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.harishraju.tech;
    ssl_certificate     /etc/letsencrypt/live/harishraju.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/harishraju.tech/privkey.pem;
    return 301 https://harishraju.tech$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name harishraju.tech;

    ssl_certificate     /etc/letsencrypt/live/harishraju.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/harishraju.tech/privkey.pem;

    root /var/www/harishraju.tech;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/css image/svg+xml application/xml text/plain;

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
